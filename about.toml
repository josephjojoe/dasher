# cargo-about: generates THIRD-PARTY-LICENSES.txt, the notices for
# everything linked into the dasher binary.
#
#   cargo about generate --manifest-path crates/cli/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES.txt
#
# CI checks that the file is up to date. The licences accepted here are the
# ones deny.toml allows.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Only what ends up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
