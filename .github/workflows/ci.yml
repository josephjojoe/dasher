name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  release:
    # Guards the deployment target: a fully static musl binary built with the
    # size-tuned release profile.
    name: release build (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p dasher-cli
      - name: Report binary size
        run: |
          bin=target/x86_64-unknown-linux-musl/release/dasher
          file "$bin"
          "$bin" --version
          echo "dasher binary: $(stat -c %s "$bin") bytes" >> "$GITHUB_STEP_SUMMARY"

  image:
    # Guards the Dockerfile: builds the image and checks that it serves.
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t dasher:ci .
      - name: Smoke test
        run: |
          docker run --rm dasher:ci --version
          docker run -d --name dasher -p 8080:8080 dasher:ci
          for _ in $(seq 50); do curl -sf localhost:8080/health && break; sleep 0.2; done
          curl -sf localhost:8080/health
          docker stop dasher
          test "$(docker inspect -f '{{.State.ExitCode}}' dasher)" = 0
      - name: Report image size
        run: |
          size=$(docker image inspect -f '{{.Size}}' dasher:ci)
          echo "dasher image: $size bytes" >> "$GITHUB_STEP_SUMMARY"
