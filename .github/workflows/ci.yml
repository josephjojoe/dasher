name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  msrv:
    # The oldest toolchain that builds dasher, as `rust-version` and the
    # README state it. `+1.88` because rust-toolchain.toml asks for stable.
    name: minimum Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --locked

  deny:
    # Advisories, licences, duplicate and wildcard dependencies, and crate
    # sources, by the policy in deny.toml.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  notices:
    # THIRD-PARTY-LICENSES.txt is generated from the dependency tree: fails
    # when a dependency change has left it behind.
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo about generate --locked --manifest-path crates/cli/Cargo.toml about.hbs -o /tmp/notices.txt
      - run: diff -u THIRD-PARTY-LICENSES.txt /tmp/notices.txt

  release:
    # Guards the deployment target: a fully static musl binary built with the
    # size-tuned release profile. Then benchmarks it on the fixture suite and
    # fails if memory or binary size goes over crates/bench/budgets.json; the
    # results land in the job summary and as an artifact.
    name: release build and benchmarks (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p dasher-cli -p dasher-bench
      - name: Check the binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/dasher
          file "$bin"
          "$bin" --version
      - name: Benchmark
        run: >
          target/x86_64-unknown-linux-musl/release/dasher-bench
          --budgets crates/bench/budgets.json
          --json bench.json
          --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmarks
          path: bench.json
          if-no-files-found: ignore

  image:
    # Guards the Dockerfile: builds the image and checks that it serves.
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t dasher:ci .
      - name: Smoke test
        run: |
          docker run --rm dasher:ci --version
          docker run -d --name dasher -p 8080:8080 dasher:ci
          for _ in $(seq 50); do curl -sf localhost:8080/health && break; sleep 0.2; done
          curl -sf localhost:8080/health
          docker stop dasher
          test "$(docker inspect -f '{{.State.ExitCode}}' dasher)" = 0
      - name: Report image size
        run: |
          size=$(docker image inspect -f '{{.Size}}' dasher:ci)
          echo "dasher image: $size bytes" >> "$GITHUB_STEP_SUMMARY"
