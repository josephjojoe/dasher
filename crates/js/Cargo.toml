[package]
name = "dasher-js"
description = "QuickJS runtime, event loop and DOM bindings for dasher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lets benchmarks turn lazy compilation off with DASHER_EAGER_JS.
replay = []

[dependencies]
bytes.workspace = true
dasher-css.workspace = true
dasher-dom.workspace = true
dasher-net.workspace = true
getrandom = "0.2"
# Scans a regexp's subject for the characters a match can start with.
memchr = "2"
# Already linked for TLS by dasher-net; used here for crypto.subtle.digest.
ring = { version = "0.17", default-features = false }
rquickjs.workspace = true
# The nodes an insertion moves, usually one, without allocating.
smallvec = "1"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
url = "2"
# Already linked for Content-Encoding by dasher-net; compresses the script
# cache's compiled code.
zstd = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
# mmap and friends, for the JS heap's slab allocator.
libc = "0.2"

[dev-dependencies]
dasher-test-server.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
