[package]
name = "dasher-serve"
description = "HTTP service and AWS Lambda runtime for dasher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
dasher.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-util = { workspace = true, features = ["http1", "server", "server-graceful", "tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }

[dev-dependencies]
dasher-test-server.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
