[package]
name = "dasher-cli"
description = "Command-line interface for dasher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# See dasher-net's feature of the same name.
replay = ["dasher/replay"]

[dependencies]
dasher.workspace = true
dasher-serve.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
dasher-test-server.workspace = true
serde_json.workspace = true

[[bin]]
name = "dasher"
path = "src/main.rs"
# The library crate is also called `dasher`; skip rustdoc for the binary so
# their documentation output paths don't collide.
doc = false
