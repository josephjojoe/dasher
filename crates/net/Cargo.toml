[package]
name = "dasher-net"
description = "HTTP client and network policy for dasher (documents, scripts and fetch/XHR only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
percent-encoding = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
dasher-test-server.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server-auto"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
