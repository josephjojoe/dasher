[package]
name = "dasher"
description = "Minimal headless browser for scraping JavaScript-rendered pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dasher-css.workspace = true
dasher-dom.workspace = true
dasher-js.workspace = true
dasher-net.workspace = true
dasher-page.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
dasher-test-server.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
