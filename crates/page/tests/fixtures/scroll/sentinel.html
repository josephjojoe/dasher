<!doctype html>
<title>Infinite scroll with an IntersectionObserver sentinel</title>
<ul id="feed"></ul>
<div id="sentinel">Loading…</div>
<script>
  // The modern pattern: a sentinel after the list; whenever it comes into
  // view, fetch the next page. React-style, it only acts on a change from
  // out of view to in view.
  const feed = document.getElementById('feed');
  const sentinel = document.getElementById('sentinel');
  let page = 0;
  let inView = false;

  async function loadMore() {
    const items = await (await fetch('/api/feed?page=' + page)).json();
    page++;
    if (items.length === 0) {
      observer.disconnect();
      sentinel.remove();
      return;
    }
    for (const text of items) {
      const li = document.createElement('li');
      li.textContent = text;
      feed.append(li);
    }
  }

  const observer = new IntersectionObserver((entries) => {
    const now = entries[entries.length - 1].isIntersecting;
    if (now && !inView) loadMore();
    inView = now;
  }, { rootMargin: '0px 0px 50px 0px' });
  observer.observe(sentinel);
</script>
