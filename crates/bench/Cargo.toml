[package]
name = "dasher-bench"
description = "Memory, time and size benchmarks for dasher on a fixture suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# For `dasher-bench pages`: answer requests from recordings (see
# dasher-net's feature of the same name).
replay = ["dasher/replay"]

[dependencies]
dasher.workspace = true
dasher-test-server.workspace = true
libc = "0.2"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[[bin]]
name = "dasher-bench"
path = "src/main.rs"
