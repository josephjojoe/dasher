[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/josephjojoe/dasher"
readme = "README.md"
keywords = ["scraping", "headless", "browser", "javascript", "serverless"]
categories = ["web-programming", "command-line-utilities"]
# Not for crates.io: a published crate cannot carry the [patch] below, and
# without it dasher-js does not link. The name `dasher` there is taken, too.
publish = false

[workspace.dependencies]
# Internal crates. Depend on these with `dasher-foo.workspace = true`. The
# versions are what a published crate would depend on; bump them with
# `workspace.package.version`.
dasher = { path = "crates/dasher", version = "0.1.0" }
dasher-css = { path = "crates/css", version = "0.1.0" }
dasher-dom = { path = "crates/dom", version = "0.1.0" }
dasher-js = { path = "crates/js", version = "0.1.0" }
dasher-net = { path = "crates/net", version = "0.1.0" }
dasher-page = { path = "crates/page", version = "0.1.0" }
dasher-serve = { path = "crates/serve", version = "0.1.0" }
dasher-test-server = { path = "crates/test-server", version = "0.1.0" }

# Third-party crates shared across the workspace.
bytes = "1"
compact_str = "0.10"
encoding_rs = "0.8"
html5ever = "0.40"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
rquickjs = { version = "0.11", default-features = false, features = ["allocator", "std"] }
serde = "1"
serde_json = "1"
tokio = "1"

# QuickJS with dasher's engine patches.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }

# Shared lints; every crate opts in with `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, so anything at "warn" fails the build.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

# Release builds target small, static binaries for Cloud Run and Lambda:
# binary size and cold-start time matter more than raw throughput.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# The JS engine is the exception to "s": pages spend most of their CPU time
# inside it, and at -O2 it runs real pages about 16% faster on Linux for
# about 0.3 MiB of binary.
[profile.release.package.rquickjs-sys]
opt-level = 2

# Release optimisations with symbols kept, for profiling and benchmarks.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

# QuickJS's interpreter at -O0 uses several times the native stack per JS
# call, so real framework code (React unmounting a deep tree) overflows the
# JS stack limit in debug builds and tests. Optimizing just the C engine
# keeps debug behaviour close to release, and makes JS-heavy tests faster.
[profile.dev.package.rquickjs-sys]
opt-level = 2
