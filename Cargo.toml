[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/josephjojoe/dasher"
publish = false

[workspace.dependencies]
# Internal crates. Depend on these with `dasher-foo.workspace = true`.
dasher = { path = "crates/dasher" }
dasher-css = { path = "crates/css" }
dasher-dom = { path = "crates/dom" }
dasher-js = { path = "crates/js" }
dasher-net = { path = "crates/net" }
dasher-page = { path = "crates/page" }
dasher-test-server = { path = "crates/test-server" }

# Third-party crates shared across the workspace.
bytes = "1"
compact_str = "0.10"
encoding_rs = "0.8"
html5ever = "0.40"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
rquickjs = { version = "0.11", default-features = false, features = ["allocator", "std"] }
serde = "1"
serde_json = "1"
tokio = "1"

# Shared lints; every crate opts in with `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, so anything at "warn" fails the build.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
mem_forget = "warn"

# Release builds target small, static binaries for Cloud Run and Lambda:
# binary size and cold-start time matter more than raw throughput.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Release optimisations with symbols kept, for profiling and benchmarks.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
